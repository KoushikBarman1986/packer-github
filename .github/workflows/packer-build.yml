name: Build Golden AMI with Packer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  packer-build:
    name: Build AWS Golden AMI
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Packer
      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(. /etc/os-release && echo $VERSION_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y packer

      # Step 3: Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::016697712044:role/my-github
          aws-region: us-east-2

      # Step 4: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 5: Initialize Packer
      - name: Packer Init
        run: packer init .

      # Step 6: Validate Packer configuration
      - name: Packer Validate
        run: packer validate .

      # Step 7: Build Golden AMI
      - name: Packer Build
        run: packer build .
